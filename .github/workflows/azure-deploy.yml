name: Build and Deploy to Azure (via GHCR)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        run: |
          IMAGE_ID=ghcr.io/${{ github.repository_owner }}/research-agent
          # Lowercase the entire IMAGE_ID
          IMAGE_ID=$(echo $IMAGE_ID | tr '[A-Z]' '[a-z]')
          echo "IMAGE_ID=$IMAGE_ID"
          
          docker build -t $IMAGE_ID:latest .
          docker push $IMAGE_ID:latest

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Container Apps
        uses: azure/CLI@v2
        with:
          inlineScript: |
            IMAGE_ID=ghcr.io/${{ github.repository_owner }}/research-agent
            IMAGE_ID=$(echo $IMAGE_ID | tr '[A-Z]' '[a-z]')
            az extension add --name containerapp --upgrade
            az containerapp update \
              --name research-agent-app \
              --resource-group rg-research-agent-v2 \
              --image $IMAGE_ID:latest \
              --set-env-vars GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}
